name: aawaj
description: "Aawaj: Your Voice Against Violence - A smart safety app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.2.2
  record: ^6.1.2
  audioplayers: ^6.5.1
  camera: 0.11.2+1
  path_provider: ^2.1.1
  share_plus: ^12.0.1
  url_launcher: ^6.2.2
  vibration: ^3.1.5
  sensors_plus: ^7.0.0
  speech_to_text: ^7.3.0
  flutter_local_notifications: ^19.5.0
  google_fonts: ^6.1.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  http: ^1.2.0
  flutter_sound: ^9.2.13
  flutter_foreground_task: ^9.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
